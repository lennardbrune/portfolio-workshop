<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio-Workshop Handout · ZU AI Club</title>
<meta name="description" content="Handout zum Workshop &quot;Deine eigene Portfolio-Website&quot; des ZU AI Club, 19.11.2026. Ablauf, Bauplan, Bauteile, Prompts, Hilfe.">
<link rel="alternate" type="text/markdown" href="handout.md" title="Handout als Markdown">
<style>
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#6b6a65;--line:#e4e1da;--code:#f1efe9;--accent:#2f5bd3}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecebe6;--muted:#9a988f;--line:#2e2d2a;--code:#22211f;--accent:#8aa8ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 80px}
.bar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;font-size:14px;z-index:1}
.bar button,.bar a{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--code);color:var(--fg);text-decoration:none;cursor:pointer}
.bar button{background:var(--fg);color:var(--bg);border-color:var(--fg)}
h1{font-size:2rem;line-height:1.2;margin:.5em 0 .3em}
h2{font-size:1.35rem;margin:2.2em 0 .6em;padding-top:.6em;border-top:1px solid var(--line)}
h3{font-size:1.05rem;margin:1.8em 0 .4em}
a{color:var(--accent)}
blockquote{margin:1em 0;padding:.2em 1em;border-left:3px solid var(--accent);color:var(--muted)}
code{background:var(--code);padding:.1em .35em;border-radius:4px;font-size:.9em}
pre{background:var(--code);padding:14px;border-radius:8px;overflow-x:auto;position:relative}
pre code{background:none;padding:0;font-size:.85em;white-space:pre-wrap}
.copy{position:absolute;top:8px;right:8px;font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg);cursor:pointer}
table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:.95em}
th,td{text-align:left;vertical-align:top;padding:6px 10px;border-bottom:1px solid var(--line)}
hr{display:none}
ul.task-list{list-style:none;padding-left:.3em}
footer{max-width:760px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="bar">
  <span>Link in Claude einfügen:</span>
  <button id="copy-link" type="button">Link kopieren</button>
  <a href="handout.md">Als Markdown</a>
</div>
<main>
$body$
</main>
<footer>ZU AI Club · Workshop-Handout · Markdown-Fassung: <a href="handout.md">handout.md</a></footer>
<script>
function flash(el,t){var o=el.textContent;el.textContent=t;setTimeout(function(){el.textContent=o},1500)}
document.getElementById('copy-link').onclick=function(){navigator.clipboard.writeText(location.href.split('#')[0]).then(()=>flash(this,'Kopiert'))};
document.querySelectorAll('pre').forEach(function(p){var b=document.createElement('button');b.className='copy';b.type='button';b.textContent='Kopieren';b.onclick=function(){navigator.clipboard.writeText(p.innerText.replace(/Kopieren$$/,'').trim()).then(()=>flash(b,'Kopiert'))};p.appendChild(b)});
</script>
</body>
</html>
